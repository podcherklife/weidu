# Bazel build of weidu-augmented (Linux).
#
# Coexists with the legacy opam/make workflows (main.yaml, docker.yaml,
# release.yaml): GitHub Actions workflows trigger independently, so this file
# neither triggers nor disables them.  This workflow is path-filtered so it
# only runs when something that feeds the Bazel build changes.
#
# The build is self-contained: the OCaml toolchain is produced/fetched by the
# repository rules in bazel/ocaml/repos.bzl from public upstream sources.
# See MODULE.bazel and bazel/README.md.
#
# Windows job: pending the MSYS2-based Windows toolchain (see
# bazel/ocaml/repos.bzl, ocaml_windows_toolchain_repo).

# Bazel build of weidu-augmented (Linux natives + Windows exes).
#
# Coexists with the legacy opam/make workflows (main.yaml, docker.yaml,
# release.yaml): GitHub Actions workflows trigger independently, so this file
# neither triggers nor disables them.  This workflow is path-filtered so it
# only runs when something that feeds the Bazel build changes.
#
# The build is self-contained: the Linux OCaml toolchain is produced/fetched
# by the repository rules in bazel/ocaml/repos.bzl from public upstream
# sources, and the Windows exes are cross-compiled inside the pinned
# container image from docker/win-cross (built lazily by the build itself
# and cached across runs via actions/cache).  See MODULE.bazel and
# bazel/README.md.

name: bazel

on:
  push:
    paths:
      # include this workflow file so edits to it itself re-trigger the build
      - ".github/workflows/bazel.yml"
      - ".bazelversion"
      - ".bazelrc"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "BUILD.bazel"
      - "bazel/**"
      - "platforms/**"
      - "docker/**"
      - "src/**"
      - "elkhound/**"
      - "zlib/**"
      - "xdiff/**"
      - "glob/**"
      - "fcase/**"
      - "batteries-lite/**"
      - "hashtbl-4.03.0/**"
      - "scripts/**"
      - "windows_resources/**"
      # sanity-check fixtures
      - "test/**"
  pull_request:
    paths:
      - ".github/workflows/bazel.yml"
      - ".bazelversion"
      - ".bazelrc"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "BUILD.bazel"
      - "bazel/**"
      - "platforms/**"
      - "docker/**"
      - "src/**"
      - "elkhound/**"
      - "zlib/**"
      - "xdiff/**"
      - "glob/**"
      - "fcase/**"
      - "batteries-lite/**"
      - "hashtbl-4.03.0/**"
      - "scripts/**"
      - "windows_resources/**"
      # sanity-check fixtures
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build (Linux x86_64, bazel)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Cache the built Linux OCaml toolchain repo, keyed on the repo
          # rule inputs (OCaml version, cc wrapper flags, patches).
          external-cache: |
            ocaml_toolchain_linux: bazel/ocaml/repos.bzl
          # Restore caches on PRs, but only write them from branch pushes.
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build (includes //:sanity check)
        run: bazelisk build //...

      # --- Windows exes (docker cross-compile; see docker/win-cross) ---

      - name: Restore cross-compile image cache
        id: image-cache
        uses: actions/cache@v4
        with:
          path: weidu-win-cross-image.tar
          key: weidu-win-cross-${{ hashFiles('docker/win-cross/Dockerfile', 'docker/win-cross/build_weidu.sh') }}

      - name: Load cross-compile image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i weidu-win-cross-image.tar

      - name: Install wine (for the Windows exe sanity check)
        # The wine64 package ships only /usr/lib/wine/wine64 on Ubuntu
        # 24.04; the /usr/bin/wine command comes from the wine package.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wine wine64

      - name: Cross-compile Windows exes (includes //:sanity_win)
        run: bazelisk build //:weidu_win_docker //:sanity_win

      - name: Save cross-compile image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          TAG="weidu-win-cross:$(cat docker/win-cross/Dockerfile docker/win-cross/build_weidu.sh | sha256sum | cut -c1-16)"
          docker save "$TAG" -o weidu-win-cross-image.tar

      - name: Collect Windows binaries
        run: |
          BIN="$(bazelisk info bazel-bin)"
          mkdir -p dist-win
          cp "$BIN/win-docker/weidu.exe" "$BIN/win-docker/weinstall.exe" "$BIN/win-docker/tolower.exe" dist-win/
          ls -la dist-win/

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v6
        with:
          name: weidu-windows-x86_64
          path: dist-win/

      - name: Collect binaries
        # The native targets are named *_native (the //:weidu etc. names
        # belong to the platform-dispatch aliases), so their outputs land
        # at bazel-bin/weidu_native etc.; dist/ gets the consumer names.
        run: |
          BIN="$(bazelisk info bazel-bin)"
          mkdir -p dist
          cp "$BIN/weidu_native" dist/weidu
          cp "$BIN/weinstall_native" dist/weinstall
          cp "$BIN/tolower_native" dist/tolower
          ls -la dist/

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: weidu-linux-x86_64
          path: dist/
